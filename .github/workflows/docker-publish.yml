name: Build API and publish image to docker

on:
  push:
    branches:
      - main
    tags: ["release-*"]
  workflow_dispatch:

jobs:
  docker:
    name: Build and publish
    # Manual runs on other branches must not publish an image.
    if: startsWith(github.ref, 'refs/tags/release-') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: meta_tag
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/abdali-water-be
          tags: |
            type=semver,pattern={{version}},match=^release-(\d+\.\d+\.\d+.*)$,prefix=v

      - name: Generate image tags and labels
        id: meta_branch
        if: github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/abdali-water-be
          tags: |
            type=raw,value=latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_tag.outputs.tags || steps.meta_branch.outputs.tags  }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
